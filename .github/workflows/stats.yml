name: stats

on:
  schedule:
    - cron: "17 4 * * *"      # once a day
  workflow_dispatch:           # "Run workflow" button
  push:
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - name: Generate graphics
        run: python scripts/build_stats.py --login "${{ github.repository_owner }}"
        env:
          # STATS_TOKEN (optional PAT with read:user) lets private-repo
          # contributions count. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit only if something changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh stats"
            git push
          fi
