<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 28" width="640" height="28" role="img" aria-label="stats"><title>stats</title><defs></defs><style>@font-face{font-family:'JB';src:url(data:font/woff2;base64,) format('woff2')}:root{--fg:#e6edf3;--mut:#7d8590;--line:#30363d;--bar:#c9d1d9;--l1:#6e7681;--l2:#79c0ff;--l3:#d2a8ff;--l4:#ffa657;--g1:#8ab4f8;--g2:#f0a868}@media (prefers-color-scheme:light){:root{--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--bar:#24292f;--l1:#8c959f;--l2:#0969da;--l3:#8250df;--l4:#bc4c00;--g1:#0550ae;--g2:#953800}}text{font-family:'JB','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0;fill:var(--fg);white-space:pre}.m{fill:var(--mut)}.l1{fill:var(--l1)}.l2{fill:var(--l2)}.l3{fill:var(--l3)}.l4{fill:var(--l4)}.ln{stroke:var(--line);stroke-width:1;fill:none}.st{stroke:var(--fg);stroke-width:1.5;fill:none}.ar{fill:var(--fg);opacity:.08}.bar{fill:var(--bar)}</style><text x="0" y="19" font-size="15" style="font-weight:700" opacity="0">stats<animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.50s" fill="freeze"/></text><line class="ln" x1="59" x2="640" y1="13.5" y2="13.5"/></svg>
